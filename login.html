<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | PayScale Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box}

    :root{
      --navy:#16223f;
      --gold:#c0995c;
      --cream:#f6f1e9;
      --card:#fffdfa;
      --border:#e9e0cf;
      --text:#16223f;
      --muted:#5a6076;
      --danger:#b5462f;
      --success:#2f6f4a;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family:'Noto Sans Arabic',sans-serif;
      background:
        radial-gradient(circle at 12% 10%,rgba(192,153,92,.16),transparent 30%),
        radial-gradient(circle at 88% 0%,rgba(22,34,63,.10),transparent 34%),
        var(--cream);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }

    .login-shell{
      width:100%;
      max-width:430px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:0 24px 56px -30px rgba(22,34,63,.36);
      padding:34px;
    }

    .brand{
      text-align:center;
      margin-bottom:28px;
    }

    .brand h1{
      margin:0;
      font-size:28px;
      font-weight:800;
      color:var(--navy);
      letter-spacing:-.4px;
    }

    .brand p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
    }

    .field{
      margin-bottom:16px;
    }

    label{
      display:block;
      margin-bottom:7px;
      font-size:13px;
      font-weight:800;
      color:var(--navy);
    }

    input{
      width:100%;
      height:48px;
      border:1px solid var(--border);
      border-radius:14px;
      padding:0 14px;
      font-family:inherit;
      font-size:14px;
      color:var(--text);
      background:#fff;
      outline:none;
    }

    input:focus{
      border-color:var(--gold);
      box-shadow:0 0 0 4px rgba(192,153,92,.14);
    }

    button{
      width:100%;
      height:50px;
      border:none;
      border-radius:14px;
      background:var(--navy);
      color:#fff;
      font-family:inherit;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
      margin-top:8px;
      box-shadow:0 14px 28px rgba(22,34,63,.18);
    }

    button:hover{
      background:#1e2f56;
    }

    button:disabled{
      opacity:.65;
      cursor:not-allowed;
    }

    .msg{
      display:none;
      margin-top:16px;
      padding:12px 14px;
      border-radius:12px;
      font-size:13px;
      font-weight:700;
      line-height:1.7;
    }

    .msg.error{
      display:block;
      background:#fbeae6;
      color:var(--danger);
      border:1px solid #f0ccc2;
    }

    .msg.success{
      display:block;
      background:#eaf3ec;
      color:var(--success);
      border:1px solid #cfe6d6;
    }

    .back{
      display:block;
      text-align:center;
      margin-top:20px;
      color:var(--muted);
      text-decoration:none;
      font-size:13px;
      font-weight:700;
    }

    .back:hover{
      color:var(--navy);
    }
  </style>
</head>

<body>

  <main class="login-shell">
    <div class="brand">
      <h1>PayScale Hub</h1>
      <p>تسجيل دخول العملاء للوصول إلى منصة النتائج وبناء سلم الرواتب.</p>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="username">اسم المستخدم</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button id="loginBtn" type="submit">دخول</button>

      <div id="message" class="msg"></div>
    </form>

    <a class="back" href="index.html">العودة إلى الصفحة الرئيسية</a>
  </main>

  <script>
    const WEB_APP_URL = "";

    const form = document.getElementById("loginForm");
    const btn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    function showMessage(type, text){
      message.className = "msg " + type;
      message.textContent = text;
    }

    form.addEventListener("submit", async function(e){
      e.preventDefault();

      if(!WEB_APP_URL){
        showMessage("error", "صفحة تسجيل الدخول جاهزة، لكن لم يتم ربطها بعد بنظام التحقق.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "جاري التحقق...";

      try{
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();

        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if(result.success && result.link){
          showMessage("success", "تم تسجيل الدخول بنجاح، جاري تحويلك...");
          window.location.href = result.link;
        }else{
          showMessage("error", result.message || "بيانات الدخول غير صحيحة.");
        }

      }catch(err){
        showMessage("error", "تعذر الاتصال بنظام التحقق. حاول مرة أخرى.");
      }

      btn.disabled = false;
      btn.textContent = "دخول";
    });
  </script>

</body>
</html>
