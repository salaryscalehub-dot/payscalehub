<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PayScale Hub — طلب خدمة المقارنة المرجعية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal','Avenir Next',sans-serif;background:#f6f1e9;color:#16223f;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.7}
::selection{background:#c0995c;color:#fff}
input,select,button{font-family:inherit}
input::placeholder{color:#b3aa97}

/* ── Layout ── */
.wrap{max-width:1120px;margin:0 auto;padding:40px 24px 80px}

/* ── Header ── */
header{background:rgba(246,241,233,.9);backdrop-filter:blur(14px);border-bottom:1px solid #e9e0cf;position:sticky;top:0;z-index:40}
.hdr-inner{max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#16223f}
.logo-icon{width:33px;height:33px;border-radius:9px;background:#16223f;display:flex;align-items:center;justify-content:center}
.logo-dot{width:11px;height:11px;border-radius:50%;background:#c0995c}
.logo-text{font-weight:800;font-size:19px;letter-spacing:-.3px}
.logo-text span{color:#c0995c}
.back-link{color:#7a7f8f;font-size:14px;font-weight:500;text-decoration:none;display:flex;align-items:center;gap:6px}
.back-link:hover{color:#16223f}

/* ── Title ── */
.page-title{text-align:center;max-width:760px;margin:0 auto 14px}
.eyebrow{font-family:'Manrope',sans-serif;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#c0995c}
.page-title h1{font-size:clamp(24px,3.4vw,38px);font-weight:800;letter-spacing:-.4px;margin:10px 0 0}
.page-title p{font-size:16px;color:#5a6076;margin:12px 0 0;line-height:1.85}

/* ── Steps Indicator ── */
.steps{display:flex;align-items:center;justify-content:center;gap:0;margin:32px auto 34px;max-width:780px}
.step-wrap{display:flex;align-items:center;flex:1;min-width:0}
.step-btn{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;flex:none;width:84px}
.step-btn.reachable{cursor:pointer}
.step-circle{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;transition:.25s}
.step-circle.active{background:#16223f;color:#fff;box-shadow:0 8px 18px rgba(22,34,63,.25)}
.step-circle.done{background:#c0995c;color:#16223f}
.step-circle.todo{background:#fff;color:#b3aa97;border:1px solid #e3d9c7}
.step-label{font-size:12px;line-height:1.4;max-width:84px}
.step-label.active{color:#16223f;font-weight:700}
.step-label.done{color:#5a6076;font-weight:600}
.step-label.todo{color:#a39a86}
.step-line{flex:1;height:2px;margin:0 4px;margin-bottom:26px;border-radius:2px;background:#e3d9c7;transition:.3s}
.step-line.done{background:#c0995c}

/* ── Cards ── */
.card{background:#fffdfa;border:1px solid #ece3d3;border-radius:18px;box-shadow:0 18px 44px -30px rgba(22,34,63,.28);padding:32px;margin-bottom:18px}
.card h2{font-size:20px;font-weight:800;margin:0 0 4px}
.card .sub{font-size:14px;color:#7a7f8f;margin:0 0 22px}

/* ── Form Grid ── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field label{display:block;font-size:14px;color:#5a6076;margin-bottom:7px}
.req{color:#c0995c}
.field input,.field select{width:100%;padding:12px 14px;border:1px solid #e3d9c7;border-radius:10px;background:#fff;font-size:15px;color:#16223f;outline:none;transition:.2s;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:#16223f;box-shadow:0 0 0 3px rgba(22,34,63,.08)}

/* ── Error ── */
.err{background:#fbeae6;border:1px solid #f0ccc2;color:#b5462f;border-radius:11px;padding:13px 18px;font-size:14px;margin-top:16px;display:none}
.err.show{display:block}

/* ── Buttons ── */
.btn-primary{cursor:pointer;background:#16223f;color:#fff;border:none;padding:14px 28px;border-radius:12px;font-weight:700;font-size:15px;box-shadow:0 12px 26px rgba(22,34,63,.2);transition:.2s}
.btn-primary:hover{background:#1e2f56}
.btn-secondary{cursor:pointer;background:#fff;color:#16223f;border:1px solid #e3d9c7;padding:13px 22px;border-radius:12px;font-weight:700;font-size:14px;transition:.2s}
.btn-secondary:hover{border-color:#b3aa97}
.btn-accent{cursor:pointer;background:#c0995c;color:#16223f;border:none;padding:11px 20px;border-radius:10px;font-weight:700;font-size:14px;transition:.2s}
.btn-accent:hover{background:#ad8748}
.btn-ghost{cursor:pointer;background:#fff;color:#7a7f8f;border:1px solid #e3d9c7;padding:11px 16px;border-radius:10px;font-size:14px;transition:.2s}
.btn-ghost:hover{border-color:#b3aa97}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px;flex-wrap:wrap}

/* ── Step 2: Layout ── */
.s2-grid{display:grid;grid-template-columns:280px 1fr;gap:22px}
.sidebar{align-self:start;position:sticky;top:82px;background:#16223f;border-radius:18px;padding:24px;color:#fff}
.sidebar .sid-label{font-size:13px;color:#aeb6cf;margin-bottom:14px}
.sid-items{display:flex;flex-direction:column;gap:13px}
.sid-item .sid-key{font-size:12px;color:#8b93ad}
.sid-item .sid-val{font-weight:700;font-size:14.5px}
.divider{height:1px;background:rgba(255,255,255,.12);margin:18px 0}
.counter{background:rgba(192,153,92,.16);border:1px solid rgba(192,153,92,.3);border-radius:13px;padding:16px;text-align:center}
.counter .cnt-num{font-family:'Manrope',sans-serif;font-weight:700;font-size:42px;line-height:1;color:#c0995c}
.counter .cnt-lbl{font-size:13px;color:#cdb892;margin-top:5px}
.counter .cnt-min{font-size:12px;color:#8b93ad;margin-top:8px}

/* ── Filters ── */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:0}
.filter-bar select{padding:10px 13px;border:1px solid #e3d9c7;border-radius:10px;background:#fff;font-size:14px;color:#16223f;outline:none}

/* ── Table ── */
.table-wrap{background:#fffdfa;border:1px solid #ece3d3;border-radius:18px;overflow:hidden;box-shadow:0 18px 44px -30px rgba(22,34,63,.28)}
.table-head{display:grid;grid-template-columns:58px 1.7fr 1.3fr .9fr .9fr;padding:13px 18px;background:#faf6ee;border-bottom:1px solid #ece3d3;font-size:12px;color:#7a7f8f;font-weight:600}
.table-body{max-height:400px;overflow-y:auto}
.table-row{display:grid;grid-template-columns:58px 1.7fr 1.3fr .9fr .9fr;align-items:center;padding:13px 18px;border-bottom:1px solid #f3ede1;cursor:pointer;transition:background .15s;background:#fffdfa}
.table-row:hover{background:#faf6ee}
.table-row.selected{background:#fbf7f0}
.table-row:last-child{border-bottom:none}
.chk-box{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;transition:.15s;border:1.5px solid #d8cbb0;background:#fff;color:transparent}
.chk-box.checked{background:#c0995c;color:#16223f;border-color:#c0995c}
.row-name{font-weight:600;font-size:14px;color:#16223f}
.row-sec,.row-emp,.row-own{font-size:13px;color:#5a6076}
.row-emp{font-family:'Manrope',sans-serif;text-align:right}

/* ── Step 3 ── */
.step-box{display:flex;gap:16px;align-items:flex-start;background:#faf6ee;border:1px solid #efe7d8;border-radius:14px;padding:18px;margin-bottom:14px}
.step-num{width:38px;height:38px;flex:none;border-radius:10px;background:#fff;border:1px solid #e3d9c7;display:flex;align-items:center;justify-content:center;font-weight:800;color:#c0995c;font-size:16px}
.step-box-info{flex:1}
.step-box-info strong{font-size:15px;font-weight:700;display:block}
.step-box-info small{font-size:13px;color:#7a7f8f;display:block;margin-top:3px}
.upload-area{border:2px dashed #d8cbb0;border-radius:13px;padding:28px;text-align:center;background:#fff;cursor:pointer;transition:.2s;display:block}
.upload-area:hover{border-color:#c0995c;background:#fffdf8}
.upload-icon{font-size:28px;color:#c0995c}
.upload-area strong{display:block;font-size:15px;margin-top:8px}
.upload-area small{font-size:12.5px;color:#a39a86;display:block;margin-top:3px}
.file-ok{display:flex;align-items:center;justify-content:space-between;background:#eaf3ec;border:1px solid #cfe6d6;border-radius:10px;padding:11px 16px;margin-top:12px}
.file-ok span{display:flex;align-items:center;gap:8px;font-size:14px;color:#2f6f4a;font-weight:600}

/* ── Step 4: Summary ── */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.sum-card{background:#faf6ee;border:1px solid #efe7d8;border-radius:14px;padding:16px}
.sum-card .sum-key{font-size:12.5px;color:#7a7f8f;margin-bottom:5px}
.sum-card .sum-val{font-weight:700;font-size:15px;color:#16223f}
.companies-list{background:#faf6ee;border:1px solid #efe7d8;border-radius:14px;padding:18px;margin-bottom:18px}
.companies-list h3{font-size:15px;font-weight:700;margin-bottom:12px}
.co-tags{display:flex;flex-wrap:wrap;gap:8px}
.co-tag{background:#fff;border:1px solid #e3d9c7;border-radius:8px;padding:6px 12px;font-size:13px;color:#16223f}
.consent-row{display:flex;gap:12px;cursor:pointer;align-items:flex-start;background:#fff7ec;border:1px solid #f0dfc2;border-radius:12px;padding:16px}
.consent-box{width:24px;height:24px;flex:none;border-radius:7px;border:1.5px solid #d8cbb0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:transparent;margin-top:2px;transition:.15s}
.consent-box.checked{background:#c0995c;color:#16223f;border-color:#c0995c}
.consent-text{font-size:14px;color:#5a6076;line-height:1.7}

/* ── Success ── */
.success-wrap{background:#fffdfa;border:1px solid #ece3d3;border-radius:20px;box-shadow:0 24px 56px -30px rgba(22,34,63,.3);padding:52px 36px;text-align:center;max-width:640px;margin:0 auto}
.success-icon{width:76px;height:76px;border-radius:50%;background:#eaf3ec;display:flex;align-items:center;justify-content:center;margin:0 auto}
.success-wrap h2{font-size:26px;font-weight:800;margin:20px 0 0}
.success-wrap p{font-size:16px;color:#5a6076;margin:12px auto 0;max-width:440px;line-height:1.85}
.success-stats{display:inline-flex;gap:24px;margin-top:24px;background:#faf6ee;border:1px solid #efe7d8;border-radius:14px;padding:16px 24px}
.ss-item .ss-key{font-size:13px;color:#7a7f8f}
.ss-item .ss-val{font-family:'Manrope',sans-serif;font-weight:700;font-size:22px;color:#16223f}
.ss-divider{width:1px;background:#e3d9c7}

/* ── Animations ── */
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes check{from{stroke-dashoffset:48}to{stroke-dashoffset:0}}
.anim-pop{animation:pop .35s ease}

/* ── Responsive ── */
@media(max-width:768px){
  .grid2,.s2-grid,.summary-grid{grid-template-columns:1fr}
  .sidebar{position:static}
  .table-head,.table-row{grid-template-columns:42px 1fr 1fr;font-size:12px}
  .table-head span:nth-child(4),.table-head span:nth-child(5),
  .table-row .row-emp,.table-row .row-own{display:none}
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="hdr-inner">
    <a class="logo" href="#">
      <img src="https://raw.githubusercontent.com/salaryscalehub-dot/payscalehub/main/images/Logo.png" alt="PayScale Hub" style="height:36px;width:auto">
      <span class="logo-text">PayScale<span> Hub</span></span>
    </a>
    <a class="back-link" href="#">→ العودة للموقع</a>
  </div>
</header>

<div class="wrap">

  <!-- PAGE TITLE -->
  <div class="page-title">
    <div class="eyebrow">Benchmark Selection Tool</div>
    <h1>أداة طلب الخدمة واختيار شركات المقارنة</h1>
    <p>عبّئ بيانات شركتك، اختر شركات المقارنة المرجعية، ارفع ملف الموظفين والرواتب، ثم اعتمد الطلب. يلزم اختيار 7 شركات على الأقل.</p>
  </div>

  <!-- STEPS INDICATOR -->
  <div class="steps" id="stepsBar"></div>

  <!-- MAIN CONTENT -->
  <div id="mainContent"></div>

</div>

<script>
// ── Data ───────────────────────────────────────────────────
const COMPANIES = [
  {id:1,  name:'مجموعة الأفق المالية',         sector:'finserv',      employees:1200, owner:'listed'},
  {id:2,  name:'بنك المدى',                    sector:'banks',        employees:3400, owner:'listed'},
  {id:3,  name:'تقنيات الواحة',                sector:'hightech',     employees:480,  owner:'private'},
  {id:4,  name:'الرياض ديجيتال',               sector:'hightech',     employees:920,  owner:'private'},
  {id:5,  name:'مراكز التجزئة الموحّدة',       sector:'retail',       employees:5600, owner:'listed'},
  {id:6,  name:'أسواق النخبة',                 sector:'retail',       employees:2100, owner:'family'},
  {id:7,  name:'الصناعات المتقدمة',             sector:'industrial',   employees:1800, owner:'listed'},
  {id:8,  name:'بتروكيم الخليج',               sector:'oilgas',       employees:4200, owner:'listed'},
  {id:9,  name:'الطاقة الوطنية',               sector:'oilgas',       employees:6800, owner:'gov'},
  {id:10, name:'تأمين الضمان',                 sector:'insurance',    employees:760,  owner:'listed'},
  {id:11, name:'المجموعة الاستثمارية القابضة', sector:'conglomerates',employees:3100, owner:'family'},
  {id:12, name:'مقاولات العمران',              sector:'construction', employees:2400, owner:'private'},
  {id:13, name:'الخدمات اللوجستية المتكاملة', sector:'transport',    employees:1500, owner:'private'},
  {id:14, name:'علوم الحياة الطبية',           sector:'lifesci',      employees:640,  owner:'private'},
  {id:15, name:'الموارد الطبيعية المتحدة',     sector:'natres',       employees:2900, owner:'listed'},
  {id:16, name:'سلع المستهلك السريعة',         sector:'fmcg',         employees:3300, owner:'listed'},
  {id:17, name:'خدمات الأعمال الذكية',         sector:'services',     employees:540,  owner:'private'},
  {id:18, name:'القطاع التقني الحكومي',         sector:'public',       employees:8000, owner:'gov'},
  {id:19, name:'بنك الخليج التجاري',           sector:'banks',        employees:2700, owner:'listed'},
  {id:20, name:'حلول الدفع الرقمية',           sector:'finserv',      employees:410,  owner:'private'}
];

const SECTORS = {};

const OWNERS = {listed:'مدرجة', private:'خاصة', family:'عائلية', gov:'حكومية'};
const STEP_LABELS = ['معلومات الشركة','اختيار شركات المقارنة','رفع ملف الموظفين','اعتماد وإرسال'];

// ── State ──────────────────────────────────────────────────
const state = {
  step: 1,
  company: {name:'', count:'', sector:'', city:''},
  liaison: {name:'', title:'', phone:'', email:''},
  benchmarkType: 'market',
  benchmarkSectors: [],
  fileName: '',
  consent: false,
  submitted: false,
  reqNum: '',
  loading: false
};

// ── Helpers ────────────────────────────────────────────────
function sizeOf(n) { return n < 1000 ? 'small' : (n <= 3000 ? 'medium' : 'large'); }
function fmt(n) { return Number(n).toLocaleString('en-US'); }

function filteredCompanies() {
  const f = state.filters;
  return COMPANIES.filter(c =>
    (f.sector === 'all' || c.sector === f.sector) &&
    (f.size === 'all' || sizeOf(c.employees) === f.size) &&
    (f.ownership === 'all' || c.owner === f.ownership)
  );
}

// ── Render Steps Bar ──────────────────────────────────────
function renderSteps() {
  const bar = document.getElementById('stepsBar');
  bar.innerHTML = STEP_LABELS.map((label, i) => {
    const n = i + 1;
    const done = n < state.step, active = n === state.step;
    const reachable = n <= state.step;
    const circleClass = active ? 'active' : done ? 'done' : 'todo';
    const labelClass = active ? 'active' : done ? 'done' : 'todo';
    const showLine = n < 4;
    return `<div class="step-wrap">
      <div class="step-btn${reachable ? ' reachable' : ''}" onclick="${reachable ? 'goStep(' + n + ')' : ''}">
        <div class="step-circle ${circleClass}">${done ? '✓' : n}</div>
        <div class="step-label ${labelClass}">${label}</div>
      </div>
      ${showLine ? `<div class="step-line${done ? ' done' : ''}"></div>` : ''}
    </div>`;
  }).join('');
}

// ── Render Main ────────────────────────────────────────────
function render() {
  renderSteps();
  const main = document.getElementById('mainContent');

  if (state.submitted) { main.innerHTML = renderSuccess(); return; }
  if (state.step === 1) main.innerHTML = renderStep1();
  else if (state.step === 2) main.innerHTML = renderStep2();
  else if (state.step === 3) main.innerHTML = renderStep3();
  else if (state.step === 4) main.innerHTML = renderStep4();
}

// ── Step 1 ─────────────────────────────────────────────────
function renderStep1() {
  const c = state.company, l = state.liaison;
  const sectorOptions = `<option value="">اختر مجال الشركة</option>` +
  (window._sectors || []).map(s =>
    `<option value="${s}"${c.sector===s?' selected':''}>${s}</option>`
  ).join('');

  return `<div class="anim-pop">
    <div class="card">
      <h2>معلومات الشركة طالبة الخدمة</h2>
      <p class="sub">تُستخدم هذه البيانات لاقتراح شركات المقارنة الأنسب لطبيعة نشاطك وحجمك.</p>
      <div class="grid2">
        <div class="field"><label>اسم الشركة <span class="req">*</span></label>
          <input value="${c.name}" oninput="upd('company','name',this.value)" placeholder="مثال: مجموعة الأفق"></div>
        <div class="field"><label>عدد الموظفين <span class="req">*</span></label>
          <input type="number" value="${c.count}" oninput="upd('company','count',this.value)" placeholder="مثال: 1200"></div>
        <div class="field"><label>مجال الشركة <span class="req">*</span></label>
          <select onchange="upd('company','sector',this.value)">${sectorOptions}</select></div>
        <div class="field"><label>المدينة <span class="req">*</span></label>
          <input value="${c.city}" oninput="upd('company','city',this.value)" placeholder="مثال: الرياض"></div>
      </div>
    </div>
    <div class="card">
      <h2>معلومات ضابط الارتباط</h2>
      <p class="sub">جهة التواصل المسؤولة عن متابعة الطلب لدى شركتك.</p>
      <div class="grid2">
        <div class="field"><label>اسم ضابط الارتباط</label>
          <input value="${l.name}" oninput="upd('liaison','name',this.value)" placeholder="الاسم الكامل"></div>
        <div class="field"><label>المسمى الوظيفي</label>
          <input value="${l.title}" oninput="upd('liaison','title',this.value)" placeholder="مثال: مدير الموارد البشرية"></div>
        <div class="field"><label>رقم الهاتف</label>
          <input dir="ltr" value="${l.phone}" oninput="upd('liaison','phone',this.value)" placeholder="05XXXXXXXX" style="text-align:right"></div>
        <div class="field"><label>البريد الإلكتروني</label>
          <input dir="ltr" type="email" value="${l.email}" oninput="upd('liaison','email',this.value)" placeholder="name@company.com" style="text-align:right"></div>
      </div>
    </div>
    <div class="err" id="errBox"></div>
    <div class="nav-row">
      <div></div>
      <button class="btn-primary" onclick="next()">التالي: اختيار شركات المقارنة ←</button>
    </div>
  </div>`;
}

// ── Step 2 ─────────────────────────────────────────────────
function renderStep2() {
  const c = state.company;
  const sectors = window._sectors || [];

  const sectorChips = sectors.map(s => {
    const sel = state.benchmarkSectors.includes(s);
    return `<div onclick="toggleSector('${s}')" style="border:${sel ? '2px solid #16223f;background:#eef1f8;color:#16223f' : '0.5px solid #e3d9c7;background:#fff;color:#5a6076'};border-radius:8px;padding:5px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px">
      ${sel ? '<span style="font-size:12px">✓</span>' : ''} ${s}
    </div>`;
  }).join('');

  return `<div class="anim-pop">
    <div style="margin-bottom:1.5rem">
      <div class="eyebrow">الخطوة الثانية</div>
      <h1 style="font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.3px;margin:8px 0 0">نطاق المقارنة المرجعية</h1>
      <p style="font-size:15px;color:#5a6076;margin:10px 0 0;line-height:1.7">حدّد المنهجية التي تناسب أهداف مؤسستك من الدراسة</p>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px">

      <!-- الخيار الأول -->
      <div onclick="selectBenchmarkType('market')" style="background:#fffdfa;border:${state.benchmarkType==='market' ? '2px solid #16223f' : '1px solid #ece3d3'};border-radius:18px;padding:28px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:16px;transition:.2s">
        <div style="position:absolute;top:14px;left:14px;background:#16223f;color:#fff;font-size:11px;font-weight:600;padding:3px 12px;border-radius:20px">الأكثر شيوعاً</div>
        <div style="width:44px;height:44px;border-radius:10px;background:#eef1f8;display:flex;align-items:center;justify-content:center;font-size:22px">📊</div>
        <div>
          <div style="font-size:16px;font-weight:800;color:#16223f;margin-bottom:6px">مقارنة وفق توجهات السوق</div>
          <p style="font-size:13.5px;color:#5a6076;line-height:1.7;margin:0">دراسة شاملة تُقارن رواتب مؤسستك بمتوسطات السوق في مجالك، وفق معايير موضوعية وبيانات محدّثة.</p>
        </div>
        <div style="border-top:1px solid #ece3d3;padding-top:16px">
          <div style="font-size:12.5px;color:#7a7f8f;margin-bottom:10px;font-weight:600">اختر مجالات المقارنة</div>
          <div style="display:flex;flex-wrap:wrap;gap:7px">${sectorChips}</div>
        </div>
      </div>

      <!-- الخيار الثاني -->
      <div onclick="selectBenchmarkType('specific')" style="background:#fffdfa;border:${state.benchmarkType==='specific' ? '2px solid #16223f' : '1px solid #ece3d3'};border-radius:18px;padding:28px;cursor:pointer;display:flex;flex-direction:column;gap:16px;transition:.2s">
        <div style="width:44px;height:44px;border-radius:10px;background:#faf6ee;display:flex;align-items:center;justify-content:center;font-size:22px">🏢</div>
        <div>
          <div style="font-size:16px;font-weight:800;color:#16223f;margin-bottom:6px">مقارنة بشركات بعينها</div>
          <p style="font-size:13.5px;color:#5a6076;line-height:1.7;margin:0">تحديد قائمة شركات مرجعية محددة بالاسم لإجراء مقارنة دقيقة ومتخصصة تعكس طموحاتك التنافسية.</p>
        </div>
        <div style="background:#faf6ee;border:1px solid #efe7d8;border-radius:12px;padding:14px 16px;margin-top:auto">
          <div style="display:flex;align-items:flex-start;gap:9px">
            <span style="color:#c0995c;flex:none;margin-top:1px">ℹ</span>
            <p style="font-size:12.5px;color:#7a6040;line-height:1.7;margin:0">سيتواصل معك فريق PayScale Hub فور استلام طلبك لتحديد قائمة الشركات المرجعية بالتفصيل.<br><br><strong style="color:#16223f">رسوم إضافية: 20,000 ر.س</strong><br><span style="font-size:11.5px">غير شاملة ضريبة القيمة المضافة</span></p>
          </div>
        </div>
      </div>

    </div>

    <div class="err" id="errBox"></div>
    <div class="nav-row">
      <button class="btn-secondary" onclick="prev()">→ السابق</button>
      <button class="btn-primary" onclick="next()">التالي: رفع ملف الموظفين ←</button>
    </div>
  </div>`;
}

// ── Step 3 ─────────────────────────────────────────────────
function renderStep3() {
  const hasFile = !!state.fileName;
  return `<div style="max-width:760px;margin:0 auto" class="anim-pop">
    <div class="card">
      <h2>رفع ملف الموظفين والرواتب</h2>
      <p class="sub">حمّل النموذج، عبّئ بيانات الموظفين والرواتب، ثم أعد رفعه بصيغة CSV.</p>
      <div class="step-box">
        <div class="step-num">1</div>
        <div class="step-box-info">
          <strong>تحميل نموذج الموظفين والرواتب</strong>
          <small>الصيغة: CSV — يُفضّل ألا يتجاوز حجم الملف 8MB.</small>
        </div>
        <button class="btn-secondary" onclick="downloadTemplate()">⬇ تحميل النموذج</button>
      </div>
      <div class="step-box" style="flex-direction:column">
        <div style="display:flex;gap:16px;align-items:flex-start;width:100%;margin-bottom:14px">
          <div class="step-num">2</div>
          <div class="step-box-info">
            <strong>رفع الملف بعد تعبئته</strong>
            <small>اختر ملف CSV من جهازك بعد إدخال البيانات.</small>
          </div>
        </div>
        <label class="upload-area">
          <input type="file" accept=".csv" style="display:none" onchange="onFile(this)">
          <div class="upload-icon">⬆</div>
          <strong>${state.fileName || 'اختر ملف CSV'}</strong>
          <small>اضغط للاختيار أو اسحب الملف هنا</small>
        </label>
        ${hasFile ? `<div class="file-ok">
          <span><span style="color:#3f8f5f">✓</span> ${state.fileName}</span>
          <button class="btn-ghost" style="border:none;padding:0;font-size:13px" onclick="clearFile()">مسح</button>
        </div>` : ''}
      </div>
      <div class="err" id="errBox"></div>
      <div class="nav-row">
        <button class="btn-secondary" onclick="prev()">→ السابق</button>
        <button class="btn-primary" onclick="next()">التالي: اعتماد وإرسال ←</button>
      </div>
    </div>
  </div>`;
}

// ── Step 4 ─────────────────────────────────────────────────
function renderStep4() {
  const c = state.company, l = state.liaison;
  const tags = state.benchmarkSectors.map(s => `<span class="co-tag">${s}</span>`).join('');
  return `<div style="max-width:760px;margin:0 auto" class="anim-pop">
    <div class="card">
      <h2>مراجعة واعتماد الطلب</h2>
      <p class="sub">راجع البيانات قبل الإرسال النهائي.</p>
      <div class="summary-grid">
        <div class="sum-card"><div class="sum-key">اسم الشركة</div><div class="sum-val">${c.name||'—'}</div></div>
        <div class="sum-card"><div class="sum-key">عدد الموظفين</div><div class="sum-val">${c.count ? fmt(c.count) : '—'}</div></div>
        <div class="sum-card"><div class="sum-key">مجال العمل</div><div class="sum-val">${c.sector ? (SECTORS[c.sector]||c.sector) : '—'}</div></div>
        <div class="sum-card"><div class="sum-key">المدينة</div><div class="sum-val">${c.city||'—'}</div></div>
        <div class="sum-card"><div class="sum-key">ضابط الارتباط</div><div class="sum-val">${l.name||'—'}</div></div>
        <div class="sum-card"><div class="sum-key">ملف الموظفين</div><div class="sum-val">${state.fileName||'لم يُرفع'}</div></div>
      </div>
      <div class="companies-list">
        <h3>${state.benchmarkType === 'market' ? 'مجالات المقارنة المختارة' : 'مقارنة بشركات بعينها'} (${state.benchmarkSectors.length})</h3>
        <div class="co-tags">${tags}</div>
      </div>
      <div class="consent-row" onclick="toggleConsent()">
        <div class="consent-box${state.consent ? ' checked' : ''}">${state.consent ? '✓' : ''}</div>
        <div class="consent-text">أُقرّ بأن البيانات المدخلة صحيحة ودقيقة، وأفوّض فريق PayScale Hub بمعالجتها لأغراض دراسة المقارنة المرجعية للرواتب وفق سياسة الخصوصية المعتمدة.</div>
      </div>
      <div class="err" id="errBox"></div>
      <div class="nav-row">
        <button class="btn-secondary" onclick="prev()">→ السابق</button>
        <button class="btn-primary" onclick="submit()" ${state.loading ? 'disabled' : ''}>${state.loading ? 'جارٍ الإرسال...' : 'اعتماد الطلب وإرساله ✓'}</button>
      </div>
    </div>
  </div>`;
}

// ── Success ────────────────────────────────────────────────
function renderSuccess() {
  return `<div class="success-wrap anim-pop">
    <div class="success-icon">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#3f8f5f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5" style="stroke-dasharray:48;animation:check .6s .15s ease both"></path>
      </svg>
    </div>
    <h2>تم إرسال الطلب بنجاح</h2>
    <p>تم تسجيل بيانات الشركة واعتماد شركات المقارنة. رقم طلبك: <strong>${state.reqNum}</strong>. سيتواصل معك فريق PayScale Hub لبدء تنفيذ الدراسة.</p>
    <div class="success-stats">
      <div class="ss-item">
        <div class="ss-key">شركات المقارنة</div>
        <div class="ss-val" style="font-family:'Manrope',sans-serif">${state.selected.length}</div>
      </div>
      <div class="ss-divider"></div>
      <div class="ss-item">
        <div class="ss-key">ملف الموظفين</div>
        <div class="ss-val" style="font-size:15px">${state.fileName||'—'}</div>
      </div>
    </div>
    <div style="margin-top:28px">
      <button class="btn-primary" onclick="reset()">طلب جديد</button>
    </div>
  </div>`;
}

// ── Actions ────────────────────────────────────────────────
function upd(group, key, val) {
  state[group][key] = val;
  // no re-render needed for inputs (live)
  if (group === 'company' && (key === 'sector' || key === 'count')) {
    // update counter if on step 2
    if (state.step === 2) render();
  }
}

function selectBenchmarkType(type) {
  state.benchmarkType = type;
  render();
}

function toggleSector(s) {
  const idx = state.benchmarkSectors.indexOf(s);
  if (idx === -1) state.benchmarkSectors.push(s);
  else state.benchmarkSectors.splice(idx, 1);
  render();
}

function toggle(id) {
  const idx = state.selected.indexOf(id);
  if (idx === -1) state.selected.push(id);
  else state.selected.splice(idx, 1);
  render();
}

function setFilter(key, val) { state.filters[key] = val; render(); }
function clearFilters() { state.filters = {sector:'all', size:'all', ownership:'all'}; render(); }
function toggleConsent() { state.consent = !state.consent; render(); }

function goStep(n) { if (n <= state.step) { state.step = n; render(); } }

function showErr(msg) {
  const box = document.getElementById('errBox');
  if (box) { box.textContent = msg; box.classList.add('show'); }
}

function next() {
  if (state.step === 1) {
    const c = state.company;
    if (!c.name || !c.count || !c.sector || !c.city) {
      showErr('يرجى تعبئة جميع الحقول المطلوبة لمعلومات الشركة (المعلَّمة بـ *).'); return;
    }
  }
  if (state.step === 2) {
    if (state.benchmarkType === 'market' && state.benchmarkSectors.length === 0) {
      showErr('يرجى اختيار مجال مقارنة واحد على الأقل.'); return;
    }
  }
  
  if (state.step === 3 && !state.fileName) {
    showErr('يرجى رفع ملف الموظفين والرواتب قبل المتابعة.'); return;
  }
  state.step = Math.min(state.step + 1, 4);
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function prev() {
  state.step = Math.max(state.step - 1, 1);
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function suggest() {
  const co = state.company;
  const targetSize = co.count ? sizeOf(parseInt(co.count) || 0) : null;
  const sec = co.sector;
  const scored = [...COMPANIES].map(c => {
    let sc = 0;
    if (sec && c.sector === sec) sc += 3;
    if (targetSize && sizeOf(c.employees) === targetSize) sc += 2;
    return {...c, sc};
  }).sort((a, b) => b.sc - a.sc);
  state.selected = scored.slice(0, 8).map(c => c.id);
  render();
}

function onFile(input) {
  if (input.files && input.files[0]) { state.fileName = input.files[0].name; render(); }
}
function clearFile() { state.fileName = ''; render(); }

function downloadTemplate() {
  dl('employees_template.csv', '\uFEFFEmployee ID,Employee Name,Job Title,Department,Nationality,Basic Salary,Other Allowances (Optional)\n');
}

function downloadCSV() {
  const rows = COMPANIES.filter(c => state.selected.includes(c.id));
  const lines = ['\uFEFFالشركة,القطاع,عدد الموظفين,الملكية'];
  rows.forEach(c => lines.push([c.name, SECTORS[c.sector]||c.sector, c.employees, OWNERS[c.owner]||c.owner].join(',')));
  dl('benchmark_companies.csv', lines.join('\n'));
}
function dl(name, content) {
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(content);
  a.download = name; a.click();
}

function submit() {
  if (!state.consent) { showErr('يرجى الموافقة على الإقرار قبل إرسال الطلب.'); return; }
  state.loading = true; render();

  const selCos = COMPANIES.filter(c => state.selected.includes(c.id));
  const payload = {
    company: { ...state.company, sectorAr: SECTORS[state.company.sector] || state.company.sector },
    liaison: { ...state.liaison },
    selectedNames: selCos.map(c => c.name),
    selectedCompanies: selCos.map(c => ({
      name: c.name, sectorAr: SECTORS[c.sector]||c.sector,
      employees: fmt(c.employees), ownerAr: OWNERS[c.owner]||c.owner
    })),
    fileName: state.fileName
  };

  // Google Apps Script call
  const reqNum = 'REQ-' + Date.now().toString().slice(-6);
  fetch('https://script.google.com/macros/s/AKfycby1mt4doUKk0whbvpTNyyjbHsf8bir_bcX06RzIGQ62_7_CkpPPP1e5CrPySPlFyfan/exec', {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify(payload)
  })
  .then(() => {
    state.loading = false;
    state.submitted = true;
    state.reqNum = reqNum;
    render();
  })
  .catch(() => {
    state.loading = false;
    state.submitted = true;
    state.reqNum = reqNum;
    render();
  });
}

function reset() {
  Object.assign(state, {
    step:1, company:{name:'',count:'',sector:'',city:''},
    liaison:{name:'',title:'',phone:'',email:''},
    benchmarkType:'market', benchmarkSectors:[],
    fileName:'', consent:false, submitted:false, reqNum:'', loading:false
  });
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

// ── Init ───────────────────────────────────────────────────
if (typeof google !== 'undefined' && google.script) {
  google.script.run
    .withSuccessHandler(sectors => {
      window._sectors = sectors;
      render();
    })
    .getSectors();
} else {
  window._sectors = ['Construction & Material','Financial Services',
    'Industrial Goods','Insurance','IT','Retail',
    'Services','Transportation','Oil, Gas, Natural Resources','Other Sector'];
  render();
}


</script>
</body>
</html>
